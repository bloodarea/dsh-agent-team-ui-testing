<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>演示页 · 订单查询</title>
  <style>
    :root { font-family: system-ui, "Microsoft YaHei", sans-serif; color: #263244; background: #f7f9ff; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 20px; }
    main { max-width: 560px; margin: 0 auto; padding: 28px; background: white; border: 1px solid #dfe4ed; border-radius: 12px; }
    h1 { margin: 0 0 12px; font-size: 24px; }
    .intro, .hint { color: #647084; font-size: 14px; line-height: 1.7; }
    .intro { margin: 0 0 24px; }
    label { display: block; margin-bottom: 8px; font-size: 15px; }
    input { width: 100%; padding: 11px 12px; border: 1px solid #bac3d2; border-radius: 6px; font: inherit; }
    button { margin-top: 16px; padding: 10px 22px; border: 0; border-radius: 6px; background: #2563eb; color: white; font: inherit; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    input:focus-visible, button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    #result { min-height: 52px; margin: 24px 0 0; padding: 14px; border-radius: 6px; background: #f1f5f9; line-height: 1.6; }
    #result[data-state="success"] { color: #166534; background: #ecfdf3; }
    #result[data-state="error"] { color: #9a3412; background: #fff7ed; }
    .hint { margin: 18px 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>订单查询</h1>
    <p class="intro">练习页面：输入订单号，点击查询，查看结果。</p>
    <form id="order-form">
      <label for="order-id">订单号</label>
      <input id="order-id" name="order-id" type="text" placeholder="例如 A-1001" autocomplete="off" aria-describedby="order-hint">
      <button id="submit" type="submit">查询</button>
    </form>
    <p id="result" role="status" aria-live="polite" data-state="idle">请输入订单号后点击查询。</p>
    <p class="hint" id="order-hint">演示订单：A-1001。所有数据仅用于练习，不连接真实订单系统。</p>
  </main>
  <script>
    const form = document.querySelector('#order-form');
    const input = document.querySelector('#order-id');
    const result = document.querySelector('#result');
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const orderId = input.value.trim();
      if (!orderId) {
        result.dataset.state = 'error';
        result.textContent = '请先输入订单号。';
        return;
      }
      const found = orderId === 'A-1001';
      result.dataset.state = found ? 'success' : 'error';
      result.textContent = found
        ? '订单 A-1001：已发货（演示数据）。'
        : `未找到订单 ${orderId}，请试试 A-1001。`;
    });
  </script>
</body>
</html>
